<!--
  Steg 3: finn sengen og legg den til.

  Egen visning, IKKE list_devices/add_devices-malene. Malene virker bare når de
  er de første visningene i paringen — kommer man til dem fra en egen visning,
  får de aldri enhetslista og feiler med «null is not an object (evaluating
  'devices.length')». Her kalles onPairListDevices direkte i stedet, og enheten
  opprettes med Homey.createDevice.

  Ingen homey.js og ingen onHomeyReady — Homey injiserer Homey-objektet selv.
-->
<h1 class="homey-title">Søker etter sengen</h1>
<p class="homey-subtitle" id="subtitle">
  Dette tar rundt et halvt minutt. Sengen må være i paringsmodus.
</p>

<div id="list"></div>

<p id="status" class="homey-form-help"></p>

<button id="retry" class="homey-button-secondary-full" style="display:none">Søk på nytt</button>

<script type="text/javascript">
  const list = document.getElementById('list');
  const status = document.getElementById('status');
  const retry = document.getElementById('retry');
  const subtitle = document.getElementById('subtitle');

  function show(message, isError) {
    status.textContent = message || '';
    status.style.color = isError ? '#e2574c' : '';
  }

  function add(device) {
    show('Legger til …');
    list.innerHTML = '';

    // createDevice + done er det malene ville gjort for oss. Feiler den, blir
    // brukeren stående i paringen med en beskjed i stedet for et tomt vindu.
    Homey.createDevice(device)
      .then(() => Homey.done())
      .catch((error) => {
        show(error.message || 'Kunne ikke legge til sengen.', true);
        retry.style.display = '';
      });
  }

  function render(devices) {
    list.innerHTML = '';

    if (!devices || !devices.length) {
      subtitle.textContent = 'Fant ingen seng.';
      show('Sengen svarer bare de tre første minuttene etter at strømmen kom '
        + 'tilbake. Gikk det for lang tid, må du ta strømbruddet på nytt.', true);
      retry.style.display = '';
      return;
    }

    subtitle.textContent = devices.length === 1
      ? 'Fant én seng. Trykk for å legge den til.'
      : `Fant ${devices.length} senger. Velg den du vil legge til.`;

    for (const device of devices) {
      const button = document.createElement('button');
      button.className = 'homey-button-primary-full';
      button.textContent = device.name;
      button.addEventListener('click', () => add(device));
      list.appendChild(button);
    }
  }

  function search() {
    retry.style.display = 'none';
    subtitle.textContent = 'Dette tar rundt et halvt minutt. Sengen må være i paringsmodus.';
    show('Søker …');
    list.innerHTML = '';

    // Eget hendelsesnavn — 'list_devices' er reservert for malen og virker ikke her.
    Homey.emit('find_beds')
      .then((devices) => { show(''); render(devices); })
      .catch((error) => {
        show(error.message || 'Søket feilet.', true);
        retry.style.display = '';
      });
  }

  retry.addEventListener('click', search);
  search();
</script>
