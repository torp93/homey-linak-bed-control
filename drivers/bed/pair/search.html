<!--
  Steg 4: finn sengen og legg den til.

  Egen visning i stedet for list_devices-malen, fordi malen viser samme tomme
  skjerm i to situasjoner som krever helt ulik handling: sengen svarte ikke
  (ta strømbruddet på nytt), eller sengen er allerede lagt til (gjør ingenting).

  Mekanikken følger Geberit-appen, som er verifisert på denne Homeyen:
  callback-stil på Homey.emit og egen CSS. Homey injiserer homey.js selv.

  Filtreringen av allerede parede senger gjøres i driveren — den er malens
  jobb, og den gjør den ikke for oss her.

  Engelsk er appens grunnspråk — norsk vises kun når Homey står på norsk.
-->
<style>
  .lb { padding: 0 24px; line-height: 1.5; }
  .lb h2 { margin: 0 0 10px; }
  .lb .bed { display: block; width: 100%; margin-top: 10px; padding: 12px; font-size: 1em;
             text-align: left; border-radius: 6px; cursor: pointer; border: 1px solid #004B76;
             background: #004B76; color: #fff; }
  .lb .bed small { display: block; opacity: 0.8; font-size: 0.82em; margin-top: 2px; }
  .lb .retry { display: block; width: 100%; margin-top: 16px; padding: 10px; font-size: 0.95em;
               border-radius: 6px; cursor: pointer; border: 1px solid rgba(128,128,128,0.4);
               background: transparent; color: inherit; }
  .lb button[disabled] { opacity: 0.5; cursor: default; }
  .lb #note { margin-top: 14px; font-size: 0.88em; line-height: 1.45; }
  .lb #note.bad { color: #c0392b; }
  .lb #note.ok { color: #1a8a3c; }
</style>

<div class="lb">
  <p id="subtitle"></p>
  <div id="list"></div>
  <div id="note"></div>
  <button id="retry" class="retry" style="display:none"></button>
</div>

<script type="application/javascript">
(function () {
    const STRINGS = {
      en: {
        searching: 'Searching for the bed',
        takesHalfMinute: 'This takes about half a minute.',
        pairingMode: 'This takes about half a minute. The bed must be in pairing mode.',
        retry: 'Search again',
        adding: 'Adding',
        addFailed: 'Could not add the bed: ',
        foundOne: 'Found one bed',
        foundMany: (n) => 'Found ' + n + ' beds',
        pickOne: 'Tap the bed you want to add.',
        alsoKnownOne: 'One more bed answered, but it has already been added.',
        alsoKnownMany: (n) => n + ' more beds answered, but they have already been added.',
        alreadyTitle: 'The bed is already added',
        alreadyOne: 'Found one bed, and it already exists as a device.',
        alreadyMany: (n) => 'Found ' + n + ' beds, and they already exist as devices.',
        alreadyNote: 'There is nothing more to do. To add a different bed, cut its power and search again.',
        noneTitle: 'No bed found',
        noneAnswered: 'No bed answered the search.',
        seenButUnreadable: 'The bed answered, but could not be read.',
        noneNote: 'The bed only answers for the first three minutes after power came back. '
                + 'If it took too long, unplug it, wait two full minutes, plug it back in and '
                + 'search again. Also check that the ESP32 is close to the bed.',
        failedTitle: 'The search failed',
      },
      no: {
        searching: 'Søker etter sengen',
        takesHalfMinute: 'Dette tar rundt et halvt minutt.',
        pairingMode: 'Dette tar rundt et halvt minutt. Sengen må være i paringsmodus.',
        retry: 'Søk på nytt',
        adding: 'Legger til',
        addFailed: 'Kunne ikke legge til sengen: ',
        foundOne: 'Fant én seng',
        foundMany: (n) => 'Fant ' + n + ' senger',
        pickOne: 'Trykk på sengen du vil legge til.',
        alsoKnownOne: 'Én seng til svarte, men den er lagt til fra før.',
        alsoKnownMany: (n) => n + ' senger til svarte, men de er lagt til fra før.',
        alreadyTitle: 'Sengen er allerede lagt til',
        alreadyOne: 'Fant én seng, og den finnes som enhet fra før.',
        alreadyMany: (n) => 'Fant ' + n + ' senger, og de finnes som enheter fra før.',
        alreadyNote: 'Du trenger ikke gjøre noe mer. Skal du legge til en annen seng, '
                   + 'ta strømbruddet på den og søk på nytt.',
        noneTitle: 'Fant ingen seng',
        noneAnswered: 'Ingen seng svarte på søket.',
        seenButUnreadable: 'Sengen svarte, men kunne ikke leses.',
        noneNote: 'Sengen svarer bare de tre første minuttene etter at strømmen kom '
                + 'tilbake. Gikk det for lang tid, trekk ut støpselet, vent to hele '
                + 'minutter, sett det inn igjen og søk på nytt. Sjekk også at ESP32-en '
                + 'står nær sengen.',
        failedTitle: 'Søket feilet',
      },
    };

    function pickLanguage() {
      try {
        if (typeof Homey !== 'undefined' && typeof Homey.getLanguage === 'function') {
          if (Homey.getLanguage() === 'no') return STRINGS.no;
        }
      } catch (error) { /* faller gjennom til nettleserspråket */ }
      const tag = String((navigator && navigator.language) || '').toLowerCase();
      return (tag.indexOf('nb') === 0 || tag.indexOf('nn') === 0 || tag.indexOf('no') === 0)
        ? STRINGS.no : STRINGS.en;
    }

    const T = pickLanguage();

    const titleEl = { set textContent(text) { try { Homey.setTitle(text); } catch (error) { /* pynt */ } } };
    const subtitleEl = document.getElementById('subtitle');
    const listEl = document.getElementById('list');
    const noteEl = document.getElementById('note');
    const retryEl = document.getElementById('retry');

    subtitleEl.textContent = T.pairingMode;
    retryEl.textContent = T.retry;

    function note(text, cls) {
      noteEl.textContent = text || '';
      noteEl.className = cls || '';
    }

    function add(device) {
      listEl.innerHTML = '';
      retryEl.style.display = 'none';
      titleEl.textContent = T.adding;
      subtitleEl.textContent = device.name;
      note('');

      Homey.createDevice(device, (error) => {
        if (error) {
          note(T.addFailed + (error.message || error), 'bad');
          retryEl.style.display = '';
          return;
        }
        Homey.done();
      });
    }

    function render(result) {
      const devices = (result && result.devices) || [];
      const seen = (result && result.seen) || 0;
      const known = (result && result.known) || 0;

      listEl.innerHTML = '';
      retryEl.style.display = '';

      if (devices.length) {
        titleEl.textContent = devices.length === 1 ? T.foundOne : T.foundMany(devices.length);
        subtitleEl.textContent = T.pickOne;

        for (const device of devices) {
          const button = document.createElement('button');
          button.className = 'bed';
          button.innerHTML = '';
          button.appendChild(document.createTextNode(device.name));
          const small = document.createElement('small');
          small.textContent = (device.store && device.store.mac) || '';
          button.appendChild(small);
          button.addEventListener('click', () => add(device));
          listEl.appendChild(button);
        }

        if (known) {
          note(known === 1 ? T.alsoKnownOne : T.alsoKnownMany(known), 'ok');
        }
        return;
      }

      // Ingen NYE senger. De to årsakene krever helt ulik handling, så de skal
      // ikke se like ut.
      if (known) {
        titleEl.textContent = T.alreadyTitle;
        subtitleEl.textContent = known === 1 ? T.alreadyOne : T.alreadyMany(known);
        note(T.alreadyNote, 'ok');
        return;
      }

      titleEl.textContent = T.noneTitle;
      subtitleEl.textContent = seen ? T.seenButUnreadable : T.noneAnswered;
      note(T.noneNote, 'bad');
    }

    function search() {
      retryEl.style.display = 'none';
      retryEl.disabled = true;
      listEl.innerHTML = '';
      titleEl.textContent = T.searching;
      subtitleEl.textContent = T.takesHalfMinute;
      note('');

      Homey.emit('search_beds', null, (error, result) => {
        retryEl.disabled = false;
        if (error) {
          titleEl.textContent = T.failedTitle;
          subtitleEl.textContent = '';
          note(String(error.message || error), 'bad');
          retryEl.style.display = '';
          return;
        }
        render(result);
      });
    }

    retryEl.addEventListener('click', search);
    search();
})();
</script>
