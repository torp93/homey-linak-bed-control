<!--
  Steg 1: forutsetningene, samlet før brukeren blir bedt om noe som helst.

  Å søke før proxy-adressen er satt ender alltid i «fant ingen seng», og
  ingenting på den skjermen forklarer hvorfor. Butikkteksten får ikke inneholde
  oppsettsanvisninger eller lenker (Homeys retningslinjer), så dette er første
  og eneste stedet en ny bruker får vite at det kreves maskinvare i det hele
  tatt.

  Ingen <h2> her: Homey tegner tittelen selv i toppteksten, og en overskrift i
  innholdet i tillegg gir tittelen to ganger på skjermen.

  Engelsk er appens grunnspråk — norsk vises kun når Homey står på norsk.

  Homey injiserer homey.js selv — ikke legg den inn her.
-->
<style>
  .lb-intro { padding: 0 24px; line-height: 1.5; }
  .lb-intro ol { padding-left: 20px; }
  .lb-intro li { margin-bottom: 10px; }
  .lb-note { opacity: 0.7; font-size: 0.9em; margin-top: 18px; }
</style>

<div class="lb-intro">
  <p id="lead"></p>
  <ol>
    <li id="s1"></li>
    <li id="s2"></li>
    <li id="s3"></li>
    <li id="s4"></li>
    <li id="s5"></li>
  </ol>
  <p class="lb-note" id="note"></p>
</div>

<script type="application/javascript">
(function () {
    const STRINGS = {
      en: {
        title: 'Before you start',
        lead: 'Homey does not talk to the bed directly. It goes through an ESP32 running '
            + 'ESPHome as a Bluetooth proxy, so a few things need to be in place.',
        s1: 'Flash an ESP32 from your browser at torp93.github.io/homey-linak-bed-control. '
          + 'Click Install, pick the USB port and enter your WiFi on that page. No other '
          + 'software is needed, and classic ESP32, C3 and S3 boards all work.',
        s2: 'Use Chrome or Edge on a computer, and a USB cable that carries data, not just '
          + 'power. The ESP32 needs a 2.4 GHz WiFi network; it cannot join 5 GHz.',
        s3: 'Place the ESP32 a few metres from the bed, with as little concrete and metal '
          + 'in between as possible. The bed transmits weakly, and its control box sits '
          + 'under the frame.',
        s4: 'The next screen asks for the address of the ESP32. The install page shows it '
          + 'when the board connects, and it is also on the board’s own status page. Use '
          + 'a fixed IP or a DHCP reservation so it does not move.',
        s5: 'The bed accepts only one controller at a time. While Homey holds the '
          + 'connection open, the remote will not respond.',
        note: 'Once that is done you can continue, and Homey will look for the bed.',
      },
      no: {
        title: 'Før du starter',
        lead: 'Homey snakker ikke direkte med sengen. Den går via en ESP32 som kjører '
            + 'ESPHome som Bluetooth-proxy, så noen ting må være på plass.',
        s1: 'Flash en ESP32 rett fra nettleseren på torp93.github.io/homey-linak-bed-control. '
          + 'Trykk Install, velg USB-porten og skriv inn WiFi på den siden. Ingen annen '
          + 'programvare trengs, og klassisk ESP32, C3 og S3 fungerer alle.',
        s2: 'Bruk Chrome eller Edge på en datamaskin, og en USB-kabel som overfører data, '
          + 'ikke bare strøm. ESP32-en trenger et 2,4 GHz-nett; den kan ikke koble seg '
          + 'til 5 GHz.',
        s3: 'Plasser ESP32-en noen få meter fra sengen, med minst mulig betong og '
          + 'metall imellom. Sengen sender svakt, og styringsboksen sitter under '
          + 'rammen.',
        s4: 'Neste skjerm spør etter adressen til ESP32-en. Installasjonssiden viser den '
          + 'når kortet kobler seg til, og den står også på kortets egen statusside. Bruk '
          + 'fast IP eller DHCP-reservasjon så den ikke flytter seg.',
        s5: 'Sengen godtar bare én styreenhet om gangen. Mens Homey har tilkoblingen '
          + 'åpen, svarer ikke fjernkontrollen.',
        note: 'Når det er gjort, kan du gå videre, så leter Homey etter sengen.',
      },
    };

    // getLanguage finnes ikke garantert i paringsvisninger, så nettleserspråket
    // er reserven. Engelsk er grunnspråket når ingen av delene sier «no».
    function pickLanguage() {
      try {
        if (typeof Homey !== 'undefined' && typeof Homey.getLanguage === 'function') {
          if (Homey.getLanguage() === 'no') return STRINGS.no;
        }
      } catch (error) { /* faller gjennom til nettleserspråket */ }
      const tag = String((navigator && navigator.language) || '').toLowerCase();
      return (tag.indexOf('nb') === 0 || tag.indexOf('nn') === 0 || tag.indexOf('no') === 0)
        ? STRINGS.no : STRINGS.en;
    }

    const T = pickLanguage();
    for (const key of ['lead', 's1', 's2', 's3', 's4', 's5', 'note']) {
      document.getElementById(key).textContent = T[key];
    }

    try {
      Homey.setTitle(T.title);
    } catch (error) {
      // Tittelen er pynt; teksten over står på egne ben. Neste-knappen kommer
      // fra navigation.next i app.json uansett.
    }
})();
</script>
