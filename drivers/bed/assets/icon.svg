<!--
  Driverikon for en enkelt LINAK-seng: rammen sett skrått fra fotenden, med
  hodeenden hevet — det er den bevegelsen appen finnes for.

  Kilden er en trasering levert av Thomas (vbdRhx501.svg, 600x450 pt, 764
  baner). Traseringen tok med stoffteksturen som tusenvis av små prikker; de
  ble til grå grums i ikonstørrelse. Her er kun de 23 banene som bærer form
  beholdt, valgt på areal. Det fjernet samtidig produsentlogoen, som ikke
  hører hjemme i et driverikon.

  Flaten er 960x960 slik Homey krever, og fargen er currentColor — med fast
  svart ville ikonet blitt usynlig der Homey tegner det mørkt.
-->
