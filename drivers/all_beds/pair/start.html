<!--
  Gruppeenheten trenger ingen paring i vanlig forstand — den styrer sengene som
  allerede finnes. Visningen er her for å si nettopp det, og oppretter enheten
  direkte.

  Egen visning, IKKE list_devices/add_devices-malene: malene virker bare når de
  er de første visningene i paringen, og feiler med «null is not an object
  (evaluating 'devices.length')» når man kommer til dem herfra.
-->
<h1 class="homey-title">Begge senger</h1>
<p class="homey-subtitle">
  Denne enheten sender hver kommando til alle sengene du har lagt til, samtidig.
  Den er ment for en dobbeltseng som består av to separate rammer.
</p>

<p class="homey-text">
  Legg til sengene hver for seg først. Denne enheten finner dem av seg selv, og
  får med seg senger du legger til senere.
</p>

<p id="status" class="homey-form-help"></p>

<button id="add" class="homey-button-primary-full">Legg til</button>

<script type="text/javascript">
  const button = document.getElementById('add');
  const status = document.getElementById('status');

  button.addEventListener('click', () => {
    button.disabled = true;
    status.style.color = '';
    status.textContent = 'Legger til …';

    // Eget hendelsesnavn — 'list_devices' er reservert for malen og virker
    // ikke fra en egen visning. Gir én enhet, så det er ikke noe å velge mellom.
    Homey.emit('make_group')
      .then((device) => Homey.createDevice(device))
      .then(() => Homey.done())
      .catch((error) => {
        status.style.color = '#e2574c';
        status.textContent = error.message || 'Kunne ikke legge til enheten.';
        button.disabled = false;
      });
  });
</script>
