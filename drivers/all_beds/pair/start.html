<!--
  Gruppeenheten trenger ingen paring i vanlig forstand — den styrer sengene som
  allerede finnes. Visningen er her for å si nettopp det, og oppretter enheten
  direkte.

  Egen visning, IKKE list_devices/add_devices-malene: malene virker bare når de
  er de første visningene i paringen, og feiler med «null is not an object
  (evaluating 'devices.length')» når man kommer til dem herfra.
-->
<h1 class="homey-title">Begge senger</h1>
<p class="homey-subtitle">
  Denne enheten sender hver kommando til alle sengene du har lagt til, samtidig.
  Den er ment for en dobbeltseng som består av to separate rammer.
</p>

<p class="homey-text">
  Legg til sengene hver for seg først. Denne enheten finner dem av seg selv, og
  får med seg senger du legger til senere.
</p>

<button id="add" class="lb-btn" style="display:block;width:calc(100% - 48px);margin:18px 24px 0;padding:10px;font-size:0.95em;border-radius:6px;cursor:pointer;border:1px solid #004B76;background:#004B76;color:#fff">Fortsett</button>

<script type="application/javascript">
  document.getElementById('add').addEventListener('click', () => {
    Homey.showView('list_devices');
  });
</script>
