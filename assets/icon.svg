<!--
  App-ikonet: LINAKs firkantede merke, hentet fra deres logo.

  MÅ være forskjellig fra driverikonet (guideline 1.5) — det var tidligere
  samme fil som drivers/bed/assets/icon.svg.

  To ting er endret fra kildefilen bevisst:
    - Det hvite bakgrunnsrektangelet som dekket hele canvaset er fjernet.
      Guideline 1.5 krever transparent bakgrunn.
    - viewBox er beskåret til selve merket. Kildelogoen er ordmerket «LINAK»
      ved siden av merket, og et ordmerke blir en tynn stripe i et kvadratisk
      ikon. Merket alene fyller canvaset.

  Rene fills, ingen stroke: Homeys iOS-app rendrer stroke-baserte ikoner blankt.
  LINAK® er et varemerke som tilhører LINAK A/S. Denne appen er et
  hobbyprosjekt uten tilknytning til LINAK A/S.
-->
